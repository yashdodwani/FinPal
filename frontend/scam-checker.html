<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam Checker - FinPal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .back-btn {
            color: #00d9ff;
            text-decoration: none;
            font-size: 1.5rem;
        }

        .title {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .input-section h3 {
            margin-bottom: 20px;
            color: #00d9ff;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #00d9ff;
        }

        textarea::placeholder {
            color: #666;
        }

        .options {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .option-group {
            flex: 1;
            min-width: 200px;
        }

        .option-group label {
            display: block;
            color: #888;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #00d9ff;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border: none;
            border-radius: 12px;
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,217,255,0.3);
        }

        .submit-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            display: none;
        }

        .result-section.visible {
            display: block;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .risk-indicator {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .risk-low {
            background: rgba(0,255,136,0.2);
            border: 3px solid #00ff88;
        }

        .risk-medium {
            background: rgba(255,230,109,0.2);
            border: 3px solid #ffe66d;
        }

        .risk-high {
            background: rgba(255,107,107,0.2);
            border: 3px solid #ff6b6b;
        }

        .risk-details h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .risk-score {
            color: #888;
            font-size: 1.1rem;
        }

        .result-body {
            display: grid;
            gap: 20px;
        }

        .result-card {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 20px;
        }

        .result-card h4 {
            color: #00d9ff;
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-card p {
            color: #ccc;
            line-height: 1.6;
        }

        .red-flags {
            list-style: none;
        }

        .red-flags li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .red-flags li::before {
            content: '⚠️';
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .examples {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,159,67,0.1);
            border: 1px solid rgba(255,159,67,0.3);
            border-radius: 12px;
        }

        .examples h4 {
            color: #ff9f43;
            margin-bottom: 15px;
        }

        .example-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 15px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            margin: 5px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #ff9f43;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-btn">←</a>
            <h1 class="title">🚨 Scam Checker</h1>
        </header>

        <div class="input-section">
            <h3>Paste Suspicious Message</h3>
            <textarea id="message-input" placeholder="Paste the suspicious SMS, WhatsApp message, or email here..."></textarea>
            
            <div class="options">
                <div class="option-group">
                    <label>Channel (optional)</label>
                    <select id="channel-select">
                        <option value="">Auto-detect</option>
                        <option value="SMS">SMS</option>
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Email">Email</option>
                        <option value="UPI">UPI App</option>
                    </select>
                </div>
                <div class="option-group">
                    <label>Language</label>
                    <select id="language-select">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                    </select>
                </div>
            </div>

            <button class="submit-btn" id="analyze-btn">🔍 Analyze Message</button>

            <div class="examples">
                <h4>📝 Try Example Messages</h4>
                <button class="example-btn" onclick="loadExample(1)">UPI Refund Scam</button>
                <button class="example-btn" onclick="loadExample(2)">KYC Update</button>
                <button class="example-btn" onclick="loadExample(3)">Lottery Win</button>
                <button class="example-btn" onclick="loadExample(4)">Safe Message</button>
            </div>
        </div>

        <div class="result-section" id="result-section">
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Analyzing message...</p>
            </div>

            <div id="result-content" style="display: none;">
                <div class="result-header">
                    <div class="risk-indicator" id="risk-indicator">
                        <span id="risk-emoji">⚠️</span>
                    </div>
                    <div class="risk-details">
                        <h2 id="classification">Analyzing...</h2>
                        <p class="risk-score">Risk Score: <span id="risk-score">0</span>%</p>
                    </div>
                </div>

                <div class="result-body">
                    <div class="result-card">
                        <h4>⚡ Quick Warning</h4>
                        <p id="short-warning">-</p>
                    </div>

                    <div class="result-card">
                        <h4>🚩 Red Flags Detected</h4>
                        <ul class="red-flags" id="red-flags"></ul>
                    </div>

                    <div class="result-card">
                        <h4>✅ Recommended Action</h4>
                        <p id="recommended-action">-</p>
                    </div>

                    <div class="result-card">
                        <h4>📖 Detailed Explanation</h4>
                        <p id="detailed-explanation">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        const exampleMessages = {
            1: "URGENT: Your UPI payment of Rs.15,000 failed! Click here to get instant refund: http://bit.ly/upi-ref1nd. Enter OTP to verify. Act NOW or money will be lost!",
            2: "Dear Customer, Your KYC is expiring today. Update immediately to avoid account block. Call 9876543210 or visit http://kyc-update.fake.com. - Bank Team",
            3: "CONGRATULATIONS! You've won Rs.50,00,000 in Amazon Lucky Draw! To claim prize, pay processing fee of Rs.5,000 to UPI: lucky@ybl. Limited time offer!",
            4: "Hi, this is a reminder about our meeting tomorrow at 3 PM. Please confirm if you can make it. Thanks!"
        };

        function loadExample(num) {
            document.getElementById('message-input').value = exampleMessages[num];
        }

        document.getElementById('analyze-btn').addEventListener('click', analyzeMessage);

        async function analyzeMessage() {
            const message = document.getElementById('message-input').value.trim();
            if (!message) {
                alert('Please enter a message to analyze');
                return;
            }

            const channel = document.getElementById('channel-select').value;
            const language = document.getElementById('language-select').value;

            // Show result section with loading
            const resultSection = document.getElementById('result-section');
            const loading = document.getElementById('loading');
            const resultContent = document.getElementById('result-content');

            resultSection.classList.add('visible');
            loading.style.display = 'block';
            resultContent.style.display = 'none';

            document.getElementById('analyze-btn').disabled = true;

            try {
                const response = await fetch(`${API_BASE}/guardian`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: message,
                        language: language,
                        route_hint: 'SCAM_CHECK',
                        metadata: channel ? { channel: channel } : {}
                    })
                });

                const data = await response.json();
                displayResult(data);

            } catch (error) {
                console.error('Error:', error);
                alert('Failed to connect to backend. Make sure the server is running.');
            } finally {
                loading.style.display = 'none';
                resultContent.style.display = 'block';
                document.getElementById('analyze-btn').disabled = false;
            }
        }

        function displayResult(data) {
            const result = data.data;
            if (!result) {
                document.getElementById('classification').textContent = 'Error analyzing message';
                return;
            }

            const riskScore = Math.round((result.risk_score || 0) * 100);
            const isScam = result.is_scam;

            // Update risk indicator
            const indicator = document.getElementById('risk-indicator');
            indicator.className = 'risk-indicator';
            
            if (riskScore >= 70) {
                indicator.classList.add('risk-high');
                document.getElementById('risk-emoji').textContent = '🚨';
            } else if (riskScore >= 40) {
                indicator.classList.add('risk-medium');
                document.getElementById('risk-emoji').textContent = '⚠️';
            } else {
                indicator.classList.add('risk-low');
                document.getElementById('risk-emoji').textContent = '✅';
            }

            // Update text content
            document.getElementById('classification').textContent = result.classification || 'Unknown';
            document.getElementById('risk-score').textContent = riskScore;
            document.getElementById('short-warning').textContent = result.short_warning || '-';
            document.getElementById('recommended-action').textContent = result.recommended_action || '-';

            // Red flags
            const redFlagsEl = document.getElementById('red-flags');
            redFlagsEl.innerHTML = '';
            const flags = result.red_flags || [];
            if (flags.length === 0) {
                redFlagsEl.innerHTML = '<li style="color: #00ff88;">No major red flags detected</li>';
            } else {
                flags.forEach(flag => {
                    const li = document.createElement('li');
                    li.textContent = flag;
                    redFlagsEl.appendChild(li);
                });
            }

            // Detailed explanation
            const explanations = result.detailed_explanation || [];
            document.getElementById('detailed-explanation').innerHTML = explanations
                .filter(e => e)
                .map(e => `<p style="margin-bottom: 10px;">• ${e}</p>`)
                .join('') || 'No additional details.';
        }
    </script>
</body>
</html>
